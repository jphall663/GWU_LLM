<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-labelledby="title desc">
<title id="title">A bounded agent uses tools under application control</title>
<desc id="desc">A business question enters a model. Tool requests pass through validation, permissions, and limits before execution. Results or errors return to the model, which answers or stops.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#31546a"/></marker></defs>
<rect width="1040" height="440" rx="20" fill="#f4f7fa"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#183446">
<text x="520" y="46" font-size="25" font-weight="bold">Tool use with explicit execution boundaries</text>
<g stroke="#31546a" stroke-width="2">
<rect x="35" y="125" width="210" height="112" rx="12" fill="#e0ecfa"/>
<rect x="315" y="125" width="340" height="112" rx="12" fill="#fff0d9"/>
<rect x="725" y="125" width="280" height="112" rx="12" fill="#e1f1e8"/>
</g>
<text x="140" y="160" font-size="22" font-weight="bold">Model</text>
<text x="140" y="191" font-size="17">Select a tool</text><text x="140" y="215" font-size="17">or finish</text>
<text x="485" y="160" font-size="22" font-weight="bold">Application</text>
<text x="485" y="191" font-size="17">Validate arguments and permissions</text><text x="485" y="215" font-size="17">Enforce call and error limits</text>
<text x="865" y="160" font-size="22" font-weight="bold">Tool</text>
<text x="865" y="191" font-size="17">Execute an authorized read</text><text x="865" y="215" font-size="17">Return rows or an error</text>
<text x="140" y="94" font-size="16">Business question</text>
<text x="280" y="113" font-size="15">Request</text><text x="690" y="113" font-size="15">Invoke</text>
<text x="520" y="313" font-size="18">Observation changes the next step</text>
<text x="520" y="397" font-size="18">Stop on completion, missing information, refusal, failure, or an explicit limit.</text>
</g>
<g stroke="#31546a" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
<path d="M140 100 V124"/><path d="M245 180 H313"/><path d="M655 180 H723"/>
<path d="M865 237 V275 Q865 295 845 295 H750"/>
<path d="M300 295 H160 Q140 295 140 275 V240"/>
</g>
</svg>
