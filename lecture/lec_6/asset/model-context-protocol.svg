<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
<title id="title">Model Context Protocol architecture</title>
<desc id="desc">A host application uses MCP clients to connect tool servers to files, APIs, and databases. Local connections use JSON-RPC over stdio; remote connections use JSON-RPC over Streamable HTTP.</desc>
