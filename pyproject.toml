[project]
name = "gwu-llm-lecture-materials"
version = "0.1.0"
description = "Small, reproducible teaching examples for GWU LLM lectures"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29.5",
    "jupyterlab>=4.3.0",
    "matplotlib>=3.9.0",
    "numpy>=2.1.0",
    "openai>=2.6.0",
    "python-dotenv>=1.1.0",
    "keras>=3.0.0",
    "tensorflow>=2.0.0; sys_platform != 'linux'",
    "tensorflow[and-cuda]>=2.0.0; sys_platform == 'linux'",
]

[tool.uv]
package = false
